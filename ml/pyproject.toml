[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maksym Krasnov", email = "maksimkrasnov747@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ruff>=0.17.1",
]
