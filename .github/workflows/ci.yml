name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/receipts-scanner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/receipts-scanner/package-lock.json

      - name: Install dependencies
        run: npm ci

      # expo-env.d.ts is gitignored but provides Expo's ambient types (assets, etc.)
      - name: Generate Expo type references
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Type check
        run: npm run typecheck

  python:
    name: ${{ matrix.project }} (lint + typecheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, ml]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-dev --group lint

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy src
